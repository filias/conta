[project]
name = "conta"
version = "0.1.0"
description = "Accounting calendar, guides and deadline alerts for freelancers in Portugal"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
    "markdown>=3.6",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "sqlmodel>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
